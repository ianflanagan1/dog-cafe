name: ${COMPOSE_PROJECT_NAME:-dog-cafe}

networks:
  public:
    driver: bridge
  private:
    driver: bridge

volumes:
  postgres:
  redis-data:
  shared-frontend:

services:

  init:
      image: busybox
      user: 0:0
      volumes:
        - shared-frontend:/app/shared-frontend
      restart: no
      command: ["sh", "-c", "chown -R 65532:65532 /app/shared-frontend && chmod -R 0700 /app/shared-frontend"]

  nginx:
    build:
      context: ./
      dockerfile: ./deploy/nginx/Dockerfile
      target: dev
    user: 65532:65532
    depends_on:
      init:
        condition: service_completed_successfully
      php:
        condition: service_started
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/nginx.dev.conf:/etc/nginx/conf.d/nginx.dev.conf:ro
      - ./static/:/static/:rw
      - shared-frontend:/static/sh/:rw
    networks:
      - public
    ports:
      - ${HTTP_PORT:-8090}:80  # COUPLED:dev-origin. default = app/.env.example HTTP_PORT
      # - 433:433

  php:
    # image: ianflanagan1/dog-cafe-php-prod
    build:
      context: ./app/
      dockerfile: ./../deploy/php/Dockerfile
      target: dev
    user: 65532:65532
    working_dir: /app/
    env_file: ./app/.env
    volumes:
      - ./app/:/app/
      - ./deploy/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./deploy/php/php.dev.ini:/usr/local/etc/php/conf.d/php.dev.ini:ro
      - ./deploy/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
      - ./deploy/php/php-fpm.conf:/usr/local/etc/php-fpm.conf:ro
      - shared-frontend:/app/storage/uploads/:rw
    networks:
      public:
        aliases:
          - dog-cafe-php  # nginx.conf fastcgi_pass
      private:
    extra_hosts:
      - host.docker.internal:host-gateway

  redis:
    image: docker.io/library/redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 1s
      interval: 1s
      timeout: 1s
      retries: 1
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data:rw
    networks:
      private:
        aliases:
          - ${REDIS_HOST}
    # ports:
    #   - 6379:6379

  postgres:
    image: docker.io/library/postgres:17.5-alpine
    env_file: ./app/.env
    healthcheck:
      test: ["CMD-SHELL", "sh", "-c", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 1s
      interval: 1s
      timeout: 1s
      retries: 1
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - ./app/database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - postgres:/var/lib/postgresql/data:rw
    networks:
      private:
        aliases:
          - ${DB_CORE_HOST}
    #ports
    #  - 5432:5432
