# Settings Dog Cafe's team shares, read by jira-tools and product-map. Only credentials stay on
# each person's machine.

# What product-map reads to build Dog Cafe's product map. See ~/projects/cli/product-map.
[product-map]
name = "Dog Cafe"
adapter = "dog-cafe"
source = "app"
static = "static"
out = "docs/product-map"

# Where Dog Cafe's issues go, for jira-tools, and in its product map, for report-problem. See
# workspace.example.toml in ~/projects/cli/jira-tools.
[tracker]
kind = "jira"
site = "ianflanagan1.atlassian.net"
space = "KAN"
issue_type = "Task"
labels = []

[tracker.stages]
being-worked-on = "In Progress"

# Each checkout's own HTTPS hostname, .env and stack, for worktree-env: <slot>.dogcafe.<domain>,
# where the domain is each machine's own. See ~/projects/cli/worktree-env.
[worktree-env]
# COUPLED:dev-origin. https://<slot>.dogcafe.<domain> for main and wt1 to wt9 must be registered in google-console, discord-portal and the Maps key referrers (docs/external/)
name = "dogcafe"
slots = 9
env-file = "app/.env"
up = ["task", "setup"]
down = ["task", "down:delete"]

[worktree-env.env]
COMPOSE_PROJECT_NAME = "{dir}"
COMPOSE_FILE = "compose.yaml:compose.local-https-proxy.yaml"
APP_URL = "https://{host}"
SESSION_DOMAIN = "{host}"
SESSION_SECURE_COOKIE = "true"
