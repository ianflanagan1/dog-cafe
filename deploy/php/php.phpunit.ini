; PHPUnit runs, on top of php.ini and php.dev.ini (task test sets PHP_INI_SCAN_DIR to add this file)

memory_limit = 64M                      ; Larger for PHPUnit than php.ini's limit for requests

; COUPLED:disabled-functions. = php.ini:disable_functions minus PHPUnit's exceptions below
disable_functions = exec,passthru,pcntl_exec,pcntl_fork,pclose,popen,proc_get_status,proc_nice,proc_terminate,shell_exec,system,mail,dl,ini_alter,ini_restore,set_time_limit,posix_initgroups,posix_kill,posix_mkfifo,posix_setegid,posix_seteuid,posix_setgid,posix_setpgid,posix_setrlimit,posix_setsid,posix_setuid,fsockopen,pfsockopen,socket_accept,socket_bind,socket_connect,socket_create,socket_create_listen,socket_create_pair,socket_listen,socket_read,socket_recv,socket_select,socket_send,socket_write,stream_socket_client,stream_socket_server,chdir,chgrp,chown,lchgrp,lchown,link,move_uploaded_file,symlink,posix_mknod,disk_free_space,disk_total_space,get_current_user,getmygid,getmyinode,getmyuid,highlight_file,openlog,phpcredits,phpinfo,php_uname,posix_ctermid,posix_getcwd,posix_getegid,posix_geteuid,posix_getgid,posix_getgrgid,posix_getgrnam,posix_getgroups,posix_getlogin,posix_getpgrp,posix_getppid,posix_getpwnam,posix_getpwuid,posix_getrlimit,posix_getsid,posix_getuid,posix_isatty,posix_times,posix_ttyname,show_source,xdebug_info,rand,mt_srand,srand,getrandmax,lcg_value,str_shuffle,shuffle,array_rand,extract,md5_file,sha1_file
; Must stay on one line, as in php.ini.
; PHPUnit's exceptions, found by running the suite with php.ini's list:
;   Needed by PHPUnit's own vendor code:
;         ini_set, ini_get_all, parse_ini_file (PHPUnit and sebastian/environment configure and read the runtime)
;         proc_open, proc_close (sebastian/version, sebastian/environment, #[RunInSeparateProcess])
;   Used by tests, each call carrying a @phpstan-ignore with its reason (phpstan.neon bans these in tests/ too):
;         putenv (tests/Unit/Config/SessionConfigTest, in separate processes so the change can't leak)
;   Allowed in tests/ by phpstan.neon's ignoreErrors, to simulate configuration:
;         ini_set (tests/Unit/Framework/Session/SessionTest)
