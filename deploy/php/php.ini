[PHP]

;;; Resource Limits ;;;
file_uploads = Off
max_file_uploads = 2
post_max_size = 1M                      ; Max size of POST data                                                 -           PHP Warning: Unknown: POST Content-Length of N bytes exceeds the limit of M bytes in Unknown on line 0
                                        ; <= nginx:client_max_body_size, >= php.ini upload_max_filesize
                                        ; See nginx:client_body_timeout
upload_max_filesize = 1M                ; Max size of file uploads                                              -           PHP Warning: File upload error - unable to create a temporary file in Unknown on line 0
                                        ; <= nginx:client_max_body_size, <= php.ini post_max_size
                                        ; See nginx:client_body_timeout
max_input_vars = 1000                   ; Max number of input variables (Increase for complex forms)            -           PHP Warning: Unknown: Input variables exceeded M. To increase the limit change max_input_vars in php.ini.
max_input_time = 10                     ; Seconds. Timeout for parsing request. Has no overlap with max_execution_time   502         WARNING: [pool www] child N said into stderr: "PHP Warning: Maximum input time of N seconds exceeded"     upstream prematurely closed connection while reading response header from upstream
                                        ; < nginx:fastcgi_read_timeout
max_execution_time = 30                 ; Seconds. Timeout for script execution. Has no overlap with max_input_time      500 / 502   PHP Fatal error: Maximum execution time of N seconds exceeded in /path/to/script.php on line X            upstream prematurely closed connection while reading response header from upstream
                                        ; < nginx:fastcgi_read_timeout
memory_limit = 32M                      ; nginx:fastcgi_buffer_size, fastcgi_buffers, fastcgi_buffers           500 / 502   PHP Fatal error: Allowed memory size of N bytes exhausted (tried to allocate M bytes) in /path/to/script.php on line X
                                        ; Examine script's usage with `memory_get_peak_usage()`
output_buffering = 4K                   ; Flush output to PHP-FPM in 4KiB chunks. Headers/cookies must be set before the first 4KiB of output
                                        ; Align with nginx:fastcgi_buffering

;;; Error handling and logging ;;;
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED ; All except deprecations
error_log = /proc/self/fd/2
ignore_repeated_errors = Off
html_errors = Off                       ; Don't render HTML for errors in logs
zend.exception_ignore_args = On         ; Don't show argument values in stack trace

;;; Disable functions ;;;
enable_dl = Off
disable_functions = exec,passthru,pcntl_exec,pcntl_fork,pclose,popen,proc_close,proc_get_status,proc_nice,proc_open,proc_terminate,shell_exec,system,mail,dl,putenv,ini_alter,ini_restore,ini_set,set_time_limit,posix_initgroups,posix_kill,posix_mkfifo,posix_setegid,posix_seteuid,posix_setgid,posix_setpgid,posix_setrlimit,posix_setsid,posix_setuid,fsockopen,pfsockopen,socket_accept,socket_bind,socket_connect,socket_create,socket_create_listen,socket_create_pair,socket_listen,socket_read,socket_recv,socket_select,socket_send,socket_write,stream_socket_client,stream_socket_server,chdir,chgrp,chown,lchgrp,lchown,link,move_uploaded_file,symlink,disk_free_space,disk_total_space,get_current_user,getmygid,getmyinode,getmyuid,highlight_file,ini_get_all,openlog,parse_ini_file,phpcredits,phpinfo,php_uname,posix_ctermid,posix_getcwd,posix_getegid,posix_geteuid,posix_getgid,posix_getgrgid,posix_getgrnam,posix_getgroups,posix_getlogin,posix_getpgrp,posix_getppid,posix_getpwnam,posix_getpwuid,posix_getrlimit,posix_getsid,posix_getuid,posix_isatty,posix_times,posix_ttyname,show_source,xdebug_info
; Must stay on one line: PHP splits only on commas/spaces, so a multi-line value silently disables nothing.
; Order:  process execution | mail (runs sendmail) | dl, putenv | runtime config | signals, privileges
;         | network sockets | filesystem links, ownership | information disclosure
; Deliberately allowed (used by app or vendor, no security value while fopen/file_put_contents exist):
;         copy (App\Framework\Support\File::move), rmdir, ftruncate, readlink (Guzzle), getmypid (google/auth, Monolog),
;         get_defined_constants (Guzzle), curl_multi_exec (Guzzle), chmod, mkdir, rename, unlink (App\Framework\Support\File)
; Dev clears this list (php.dev.ini) for Composer, PHPUnit, PHPStan, Xdebug: re-test prod-only paths with this file.

;;; Security ;;;
expose_php = Off                        ; Disable 'X-Powered-By' header
register_argc_argv = Off                ; Only needed for PHP CLI
short_open_tag = Off                    ; Disable <?, ?> tags
allow_url_fopen = Off                   ; Stop fopen(), file_get_contents() on remote URLs
allow_url_include = Off                 ; Stop include on remote URLs
user_ini.filename =                     ; Don't scan for .user.ini files

;;; Paths ;;;
doc_root =                              ; Leave empty for web applications unless explicitly needed
;open_basedir = /app                    ; Colon separated. Disables realpath_cache
;sys_temp_dir = /app/tmp-system
;upload_tmp_dir = /app/tmp-uploads
;extension_dir = /usr/local/lib/php/extensions/no-debug-non-zts-20240924

;;; Data Handling ;;;
date.timezone = UTC                     ; Core clock. Local wall-clock time (e.g. opening hours) uses App\Enums\Locality
default_charset = UTF-8
default_mimetype = text/html
request_order = GP                      ; Process GET, then POST variables
variables_order = GPCS                  ; Order of EGPCS (Environment, GET, POST, Cookie, Server) for $_* arrays

;;; Sessions ;;;
session.name = DOGCAFEID
session.use_strict_mode = On            ; Prevents PHP accepting uninitialised session IDs. Helps prevent session fixation attacks
session.use_cookies = On
session.use_only_cookies = On
session.cookie_domain = dogcafeuk.com
session.cookie_secure = On
session.cookie_httponly = On            ; Prevents client-side scripts from accessing session cookie
session.cookie_samesite = Lax           ; Sent on top-level cross-site GET navigations (OAuth redirects back from Google/Discord), not on cross-site POST/fetch. Helps mitigate CSRF
                                        ; Never write unquoted None: it's an INI keyword (= empty), which leaves SameSite unset
session.cookie_lifetime = 31536000      ; Seconds. 31536000 = 1 year; 0 -> expire when browser closed
session.gc_maxlifetime = 31536000       ; Seconds. 31536000 = 1 year; Max time session data is retained
session.use_trans_sid = Off             ; Transparent SID support. Appends session ID to URLs if cookies are disabled by the browser. Can cause session fixation, leaking session sIDs via referrer headers, logs etc.
session.auto_start = Off
;session.gc_probability = 1             ; Redis handles TTL instead. Relevant for: `session.save_handler = files`
;session.gc_divisor = 1000              ; Probability(int)/divisor(int) -> 1/1000 -> 0.1% chance of running GC each request
;session.save_handler = redis           ; This is set in App\Framework\Session\Session::start()
;session.save_path = "tcp://{$redisHost}:{$redisPort}?auth={$redisPassword}"
;session.save_handler = files
;session.save_path = /var/lib/php/sessions ; Ensure PHP-FPM user has write access


realpath_cache_size = 2M                ; Per process, but not a subset of `memory_limit`. Examined script's usage with `realpath_cache_size()`
realpath_cache_ttl = 31536000           ; Seconds. 31536000 = 1 year

;;; Opcache ;;;
;zend_extension = opcache
opcache.enable = On                     ; Enable Opcache
opcache.enable_cli = Off                ; Don't want opcache.preload script running on CLI commands

opcache.memory_consumption = 80         ; MB (bare integer; a suffix is ignored, so 1G would mean 1MB) of shared memory for compiled scripts                 Fatal Error Not enough shared memory for preloading. Consider increasing the value for the opcache.memory_consumption directive in php.ini.
opcache.interned_strings_buffer = 8     ; MB for storing interned strings. Used IMMEDIATELY in [memory_usage][used_memory]
opcache.max_accelerated_files = 10000   ; Max cached scripts. Rounded up to the next prime in PHP's table (16229)
                                        ; Only files actually included count. Check opcache_get_status()['opcache_statistics']['num_cached_scripts']

opcache.validate_timestamps = Off       ; Don't check scripts for updates. Clear by restarting PHP-FPM, `php -r "opcache_reset();"` or `php -r "opcache_invalidate();"`
opcache.force_restart_timeout = 0       ; Seconds. Time to restart when exceeding opcache.max_accelerated_files, opcache.max_wasted_percentage
opcache.optimization_level = 0x7FFFBBFF ; Enable all default optimizations
opcache.save_comments = Off             ; Breaks libraries that need annotations
opcache.jit = disable                   ; PHP 8.4 default; stated so a version bump can't silently enable JIT

opcache.max_wasted_percentage = 5       ; Max percentage of wasted memory before a restart is scheduled
opcache.use_cwd = On                    ; Append current working directory to prevent filename collisions
;opcache.preload = /app/opcache-preload.php


; https://github.com/docker-library/php/issues/878#issuecomment-938595965
fastcgi.logging = Off
