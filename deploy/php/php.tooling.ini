; Composer, PHPStan and Pint, on top of php.ini and php.dev.ini (their tasks set PHP_INI_SCAN_DIR to add this file)
; Never loaded by the web server or PHPUnit. Nothing these tools run ships to production.

memory_limit = 1G                       ; PHPStan, and Composer resolving dependencies

disable_functions =                     ; Clear php.ini's list: all three fail under it (Composer first on xdebug_info, PHPStan and Pint on ini_set),
                                        ; and Composer also needs exec, proc_open, putenv, symlink, chdir, ... to install packages

allow_url_fopen = On                    ; Needed by `composer install` to download from dist
